[package]
name = "shared"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# `shared` = ECS do jogo em Bevy PURO, sem bevy_render (padroes §1 / RFC 0001 §5).
# Só a feature `std` da fachada bevy: traz bevy_app/bevy_ecs/bevy_math/bevy_time (core,
# não feature-gated) e NENHUM crate de render. Verificado pelo gate (xtask).
[dependencies]
bevy = { workspace = true, features = ["std"] }
serde = { workspace = true }
thiserror = { workspace = true }
# Protocolo de replicação (registro de componentes/eventos) compartilhado cliente↔servidor.
bevy_replicon = { workspace = true }

[lints]
workspace = true
