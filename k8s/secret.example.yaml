# Exemplo do Secret com a URL do Postgres do cluster (ns `postgres`). NÃO comitar o real.
# Crie com: kubectl create secret generic ragnadofus-db \
#   --from-literal=database-url='postgres://USER:PASS@postgres-postgresql.postgres.svc:5432/ragnadofus'
apiVersion: v1
kind: Secret
metadata:
  name: ragnadofus-db
type: Opaque
stringData:
  database-url: postgres://USER:PASS@postgres-postgresql.postgres.svc:5432/ragnadofus
