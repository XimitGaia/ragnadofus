[package]
name = "client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Cliente desktop COM render. Features curadas à mão (e não a meta-feature `2d`) porque
# `default_platform` arrasta `bevy_gilrs` (libudev) e a meta `audio` arrasta `bevy_audio`
# (libasound) — ambos ausentes nesta máquina e desnecessários para a Demo 01. Render de
# verdade (`bevy_render`, 2D, winit) fica ligado — o gate prova que `bevy_render` está no
# fecho do cliente. Áudio/gamepad voltam quando libasound2-dev/libudev-dev existirem (ver
# docs/debito-tecnico.md DT-03).
[dependencies]
shared = { path = "../shared" }
# Rede (P4): cliente replicon + transporte renet2/UDP.
bevy_replicon = { workspace = true }
bevy_replicon_renet2 = { workspace = true }
anyhow = { workspace = true }
bevy = { workspace = true, features = [
    "std",
    "multi_threaded",
    "default_app",     # async_executor, bevy_asset, bevy_log, bevy_state, reflect_auto_register
    "2d_bevy_render",  # bevy_render + core_pipeline + sprite_render + 2d_api (bevy_sprite)
    # Render 3D COMPLETO (Camera3d/Mesh3d/StandardMaterial + core_pipeline, bevy_light,
    # anti_alias, post_process, LUTs e os SHADERS do pbr). `bevy_pbr` sozinho NÃO traz os
    # companheiros de shader -> a pipeline trava sem carregar. NÃO puxa default_platform
    # (gilrs/audio continuam fora -> DT-03 preservado).
    "3d_bevy_render",
    "ui_bevy_render",  # UI (botoes/texto) SEM default_platform -> nao puxa gilrs/audio (DT-03 ok)
    "ui_picking",      # clique nativo em botoes de UI (tambem nao puxa default_platform)
    "bevy_winit",
    "x11",
    "wayland",
    "default_font",
    "png",
] }

[lints]
workspace = true
