# Config de cargo-deny (supply-chain). Hoje a ferramenta não está instalada na máquina;
# o xtask roda `cargo deny check` APENAS se presente (senão avisa e pula — nunca passa
# em silêncio). O gate de direção do grafo + ausência de bevy_render é feito pelo próprio
# xtask via `cargo metadata`/`cargo tree`, sem depender de cargo-deny.
[advisories]
version = 2
yanked = "deny"

[bans]
multiple-versions = "warn"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "ISC",
]
